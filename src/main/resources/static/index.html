<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Picker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        background: #f4f7fb;
        color: #1f2937;
      }
      .container {
        max-width: 700px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        margin-top: 0;
      }
      .controls {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      input {
        flex: 1;
        padding: 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 1rem;
      }
      button {
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #1d4ed8;
      }
      .remove-button {
        background: #dc2626;
        padding: 0.5rem 0.75rem;
        font-size: 0.875rem;
      }
      .remove-button:hover {
        background: #b91c1c;
      }
      .picked-user {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 8px;
        background: #ecfdf5;
        color: #065f46;
        font-weight: bold;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 0.5rem;
        border-bottom: 1px solid #e5e7eb;
      }
      .user-info {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .user-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
      }
      .percentage {
        font-weight: bold;
        color: #374151;
      }
      .last-picked {
        font-size: 0.8rem;
        color: #6b7280;
      }
      .error {
        color: #b91c1c;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>User Picker</h1>

      <div class="controls">
        <input id="newUserName" type="text" placeholder="Enter new user name" />
        <button id="addUserButton">Add user</button>
      </div>

      <button id="pickButton">Pick a user</button>

      <div id="pickedUser" class="picked-user" style="display: none;"></div>
      <div id="error" class="error" style="display: none;"></div>

      <h2>Users</h2>
      <ul id="userList"></ul>
    </div>

    <script>
      const userList = document.getElementById('userList');
      const pickButton = document.getElementById('pickButton');
      const addUserButton = document.getElementById('addUserButton');
      const newUserName = document.getElementById('newUserName');
      const pickedUser = document.getElementById('pickedUser');
      const errorBox = document.getElementById('error');

      function formatLastPicked(dateString) {
        const date = new Date(dateString);
        const diffMs = Date.now() - date.getTime();
        const seconds = Math.max(0, Math.floor(diffMs / 1000));

        if (seconds < 60) {
          return `${seconds} second${seconds === 1 ? '' : 's'} ago`;
        }

        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) {
          return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
        }

        const hours = Math.floor(minutes / 60);
        if (hours < 24) {
          return `${hours} hour${hours === 1 ? '' : 's'} ago`;
        }

        const days = Math.floor(hours / 24);
        if (days < 7) {
          return `${days} day${days === 1 ? '' : 's'} ago`;
        }

        const weeks = Math.floor(days / 7);
        if (weeks < 4) {
          return `${weeks} week${weeks === 1 ? '' : 's'} ago`;
        }

        const months = Math.floor(weeks / 4);
        return `${months} month${months === 1 ? '' : 's'} ago`;
      }

      async function fetchUsers() {
        const response = await fetch('/users');
        if (!response.ok) throw new Error('Failed to load users');
        const users = await response.json();

        userList.innerHTML = users
          .map(
            (user) => `
              <li>
                <span class="user-info">
                  <span>${user.name}</span>
                  <button class="remove-button" data-name="${user.name}">Remove</button>
                </span>
                <span class="user-meta">
                  <span class="percentage">${Number(user.pickPercentage).toFixed(2)}%</span>
                  <span class="last-picked">Last picked: ${formatLastPicked(user.dateLastPicked)}</span>
                </span>
              </li>
            `
          )
          .join('');

        document.querySelectorAll('.remove-button').forEach((button) => {
          button.addEventListener('click', async () => {
            await removeUser(button.dataset.name);
          });
        });
      }

      async function removeUser(name) {
        const response = await fetch(`/users/${encodeURIComponent(name)}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          throw new Error('Could not remove user');
        }

        await fetchUsers();
      }

      async function addUser() {
        const name = newUserName.value.trim();
        if (!name) {
          errorBox.textContent = 'Please enter a user name';
          errorBox.style.display = 'block';
          return;
        }

        const response = await fetch('/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });

        if (!response.ok) {
          throw new Error('Could not add user');
        }

        newUserName.value = '';
        errorBox.style.display = 'none';
        await fetchUsers();
      }

      async function pickUser() {
        errorBox.style.display = 'none';
        pickedUser.style.display = 'none';

        const response = await fetch('/users/pick');
        if (!response.ok) {
          throw new Error('Could not pick a user');
        }

        const selectedUser = await response.json();
        pickedUser.textContent = `Picked user: ${selectedUser.name}`;
        pickedUser.style.display = 'block';

        await fetchUsers();
      }

      addUserButton.addEventListener('click', async () => {
        try {
          await addUser();
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = 'block';
        }
      });

      pickButton.addEventListener('click', async () => {
        try {
          await pickUser();
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = 'block';
        }
      });

      fetchUsers().catch((err) => {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      });
    </script>
  </body>
</html>
