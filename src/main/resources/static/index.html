<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Member Picker</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 2rem;
        background: #000000;
        color: #ec4899;
      }
      .container {
        max-width: 700px;
        margin: 0 auto;
        background: #1f1f23;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
      }
      h1 {
        margin-top: 0;
        text-align: center;
      }
      .controls {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }
      input {
        flex: 1;
        padding: 0.75rem;
        border: 1px solid #ec4899;
        border-radius: 8px;
        font-size: 1rem;
        background: #2a2a30;
        color: #f472b6;
      }
      button {
        background: #db2777;
        color: #ffffff;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        padding: 0.75rem 1.25rem;
        font-size: 1rem;
        cursor: pointer;
      }
      button:hover {
        background: #be185d;
      }
      button:disabled {
        background: #6b7280;
        color: #1f2937;
        cursor: not-allowed;
      }
      .remove-button {
        background: #831843;
        color: #fce7f3;
        padding: 0.5rem 0.75rem;
        font-size: 0.875rem;
      }
      .remove-button:hover {
        background: #6b1237;
      }
      #pickButton {
        display: block;
        margin: 0 auto;
      }
      .picked-user {
        margin-top: 1rem;
        padding: 1rem;
        border-radius: 8px;
        background: #2a2a30;
        color: #ec4899;
        font-weight: bold;
        text-align: center;
      }
      ul {
        list-style: none;
        padding: 0;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 0.75rem 0.5rem;
        border-bottom: 1px solid #3f3f46;
      }
      .user-info {
        display: grid;
        grid-template-columns: 10rem 7rem auto;
        align-items: center;
        gap: 0.75rem;
      }
      .user-name {
        overflow-wrap: anywhere;
      }
      .user-meta {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        text-align: right;
      }
      .percentage {
        font-weight: bold;
        color: #ec4899;
      }
      .last-picked {
        font-size: 0.8rem;
        color: #ec4899;
        opacity: 0.75;
      }
      .unavailable .user-name,
      .unavailable .percentage,
      .unavailable .last-picked {
        color: #6b7280;
      }
      .availability-toggle {
        display: flex;
        align-items: center;
        gap: 0.25rem;
        font-size: 0.8rem;
        color: #ec4899;
        cursor: pointer;
      }
      .availability-toggle input {
        flex: none;
        margin: 0;
      }
      .wheel-wrapper {
        position: relative;
        width: 320px;
        height: 320px;
        margin: 1.5rem auto;
      }
      #wheel {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        transition: transform 5s cubic-bezier(0.17, 0.67, 0.12, 0.99);
      }
      .wheel-pointer {
        position: absolute;
        top: -10px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-top: 24px solid #db2777;
        z-index: 1;
      }
      dialog {
        background: #1f1f23;
        color: #ec4899;
        border: none;
        border-radius: 12px;
        padding: 1.5rem 2rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
        text-align: center;
      }
      dialog::backdrop {
        background: rgba(0, 0, 0, 0.4);
      }
      .dialog-actions {
        display: flex;
        justify-content: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .decline-button {
        background: #831843;
        color: #fce7f3;
      }
      .decline-button:hover {
        background: #6b1237;
      }
      .error {
        color: #f87171;
        text-align: center;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Team Member Picker</h1>

      <div class="controls">
        <input id="newUserName" type="text" placeholder="Enter new team member name" />
        <button id="addUserButton">Add team member</button>
      </div>

      <div class="wheel-wrapper">
        <div class="wheel-pointer"></div>
        <canvas id="wheel" width="640" height="640"></canvas>
      </div>

      <button id="pickButton">Pick a team member</button>

      <div id="pickedUser" class="picked-user" style="display: none;"></div>
      <div id="error" class="error" style="display: none;"></div>

      <h2>Team Members</h2>
      <ul id="userList"></ul>
    </div>

    <dialog id="pickDialog">
      <p id="pickDialogText"></p>
      <div class="dialog-actions">
        <button id="agreeButton">Agree</button>
        <button id="declineButton" class="decline-button">Decline</button>
      </div>
    </dialog>

    <script>
      const userList = document.getElementById('userList');
      const pickButton = document.getElementById('pickButton');
      const addUserButton = document.getElementById('addUserButton');
      const newUserName = document.getElementById('newUserName');
      const pickedUser = document.getElementById('pickedUser');
      const errorBox = document.getElementById('error');
      const pickDialog = document.getElementById('pickDialog');
      const pickDialogText = document.getElementById('pickDialogText');
      const agreeButton = document.getElementById('agreeButton');
      const declineButton = document.getElementById('declineButton');

      const wheel = document.getElementById('wheel');
      const wheelCtx = wheel.getContext('2d');
      let wheelNames = [];
      let wheelRotation = 0;

      function drawWheel() {
        const size = wheel.width;
        const center = size / 2;
        const count = wheelNames.length;
        wheelCtx.clearRect(0, 0, size, size);

        if (count === 0) {
          wheelCtx.fillStyle = '#e5e7eb';
          wheelCtx.beginPath();
          wheelCtx.arc(center, center, center, 0, Math.PI * 2);
          wheelCtx.fill();
          wheelCtx.fillStyle = '#6b7280';
          wheelCtx.font = '28px Arial';
          wheelCtx.textAlign = 'center';
          wheelCtx.fillText('No team members available', center, center);
          return;
        }

        const segment = (Math.PI * 2) / count;
        wheelNames.forEach((name, i) => {
          const start = -Math.PI / 2 + i * segment;
          wheelCtx.beginPath();
          wheelCtx.moveTo(center, center);
          wheelCtx.arc(center, center, center, start, start + segment);
          wheelCtx.closePath();
          wheelCtx.fillStyle = `hsl(${(i * 360) / count}, 70%, 60%)`;
          wheelCtx.fill();
          wheelCtx.strokeStyle = 'white';
          wheelCtx.lineWidth = 3;
          wheelCtx.stroke();

          wheelCtx.save();
          wheelCtx.translate(center, center);
          wheelCtx.rotate(start + segment / 2);
          wheelCtx.fillStyle = '#111827';
          wheelCtx.font = 'bold 28px Arial';
          wheelCtx.textAlign = 'right';
          wheelCtx.textBaseline = 'middle';
          wheelCtx.fillText(name.length > 14 ? `${name.slice(0, 13)}…` : name, center - 24, 0);
          wheelCtx.restore();
        });
      }

      function updateWheel(users) {
        const names = users
          .filter((user) => user.isAvailable)
          .map((user) => user.name)
          .sort((a, b) => a.localeCompare(b));

        if (names.join('\n') === wheelNames.join('\n')) return;

        wheelNames = names;
        wheelRotation = 0;
        wheel.style.transition = 'none';
        wheel.style.transform = 'rotate(0deg)';
        drawWheel();
      }

      function spinWheelTo(name) {
        const index = wheelNames.indexOf(name);
        if (index === -1) return Promise.resolve();

        const segmentDeg = 360 / wheelNames.length;
        const jitter = (Math.random() - 0.5) * segmentDeg * 0.7;
        const targetAngle = (((-(index + 0.5) * segmentDeg + jitter) % 360) + 360) % 360;
        const currentAngle = ((wheelRotation % 360) + 360) % 360;
        wheelRotation += 5 * 360 + ((targetAngle - currentAngle + 360) % 360);

        return new Promise((resolve) => {
          const done = () => {
            wheel.removeEventListener('transitionend', done);
            clearTimeout(timer);
            resolve();
          };
          const timer = setTimeout(done, 5500);
          wheel.addEventListener('transitionend', done);
          wheel.style.transition = '';
          void wheel.offsetWidth;
          wheel.style.transform = `rotate(${wheelRotation}deg)`;
        });
      }

      function formatLastPicked(dateString) {
        const date = new Date(dateString);
        const diffMs = Date.now() - date.getTime();
        const seconds = Math.max(0, Math.floor(diffMs / 1000));

        if (seconds < 60) {
          return `${seconds} second${seconds === 1 ? '' : 's'} ago`;
        }

        const minutes = Math.floor(seconds / 60);
        if (minutes < 60) {
          return `${minutes} minute${minutes === 1 ? '' : 's'} ago`;
        }

        const hours = Math.floor(minutes / 60);
        if (hours < 24) {
          return `${hours} hour${hours === 1 ? '' : 's'} ago`;
        }

        const days = Math.floor(hours / 24);
        if (days < 7) {
          return `${days} day${days === 1 ? '' : 's'} ago`;
        }

        const weeks = Math.floor(days / 7);
        if (weeks < 4) {
          return `${weeks} week${weeks === 1 ? '' : 's'} ago`;
        }

        const months = Math.floor(weeks / 4);
        return `${months} month${months === 1 ? '' : 's'} ago`;
      }

      async function fetchUsers() {
        const response = await fetch('/users');
        if (!response.ok) throw new Error('Failed to load team members');
        const users = await response.json();
        updateWheel(users);

        userList.innerHTML = users
          .map(
            (user) => `
              <li class="${user.isAvailable ? '' : 'unavailable'}">
                <span class="user-info">
                  <span class="user-name">${user.name}</span>
                  <label class="availability-toggle">
                    <input type="checkbox" class="availability-checkbox" data-name="${user.name}" ${user.isAvailable ? 'checked' : ''} />
                    Available
                  </label>
                  <button class="remove-button" data-name="${user.name}">Remove</button>
                </span>
                <span class="user-meta">
                  <span class="percentage">${Number(user.pickPercentage).toFixed(2)}%</span>
                  <span class="last-picked">Last picked: ${formatLastPicked(user.dateLastPicked)}</span>
                </span>
              </li>
            `
          )
          .join('');

        document.querySelectorAll('.availability-checkbox').forEach((checkbox) => {
          checkbox.addEventListener('change', async () => {
            try {
              await setAvailability(checkbox.dataset.name, checkbox.checked);
            } catch (err) {
              errorBox.textContent = err.message;
              errorBox.style.display = 'block';
              await fetchUsers();
            }
          });
        });

        document.querySelectorAll('.remove-button').forEach((button) => {
          button.addEventListener('click', async () => {
            await removeUser(button.dataset.name);
          });
        });
      }

      async function setAvailability(name, isAvailable) {
        const response = await fetch(`/users/${encodeURIComponent(name)}/availability`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ isAvailable })
        });

        if (!response.ok) {
          throw new Error('Could not update availability');
        }

        await fetchUsers();
      }

      async function removeUser(name) {
        const response = await fetch(`/users/${encodeURIComponent(name)}`, {
          method: 'DELETE'
        });

        if (!response.ok) {
          throw new Error('Could not remove team member');
        }

        await fetchUsers();
      }

      async function addUser() {
        const name = newUserName.value.trim();
        if (!name) {
          errorBox.textContent = 'Please enter a team member name';
          errorBox.style.display = 'block';
          return;
        }

        const response = await fetch('/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name })
        });

        if (!response.ok) {
          throw new Error('Could not add team member');
        }

        newUserName.value = '';
        errorBox.style.display = 'none';
        await fetchUsers();
      }

      function askAgreement(name) {
        return new Promise((resolve) => {
          pickDialogText.textContent = `${name} has been picked. Do you agree?`;
          const finish = (agreed) => {
            agreeButton.onclick = declineButton.onclick = pickDialog.oncancel = null;
            pickDialog.close();
            resolve(agreed);
          };
          agreeButton.onclick = () => finish(true);
          declineButton.onclick = () => finish(false);
          pickDialog.oncancel = (event) => {
            event.preventDefault();
            finish(false);
          };
          pickDialog.showModal();
        });
      }

      async function pickUser() {
        errorBox.style.display = 'none';
        pickedUser.style.display = 'none';

        const response = await fetch('/users/pick');
        if (!response.ok) {
          throw new Error('Could not pick a team member');
        }

        const selectedUser = await response.json();
        await spinWheelTo(selectedUser.name);
        const agreed = await askAgreement(selectedUser.name);

        if (agreed) {
          const confirmResponse = await fetch(`/users/${encodeURIComponent(selectedUser.name)}/confirm`, {
            method: 'POST'
          });
          if (!confirmResponse.ok) {
            throw new Error('Could not confirm the pick');
          }
          pickedUser.textContent = `Picked team member: ${selectedUser.name}`;
        } else {
          pickedUser.textContent = `${selectedUser.name} declined to be picked`;
        }
        pickedUser.style.display = 'block';

        await fetchUsers();
      }

      addUserButton.addEventListener('click', async () => {
        try {
          await addUser();
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = 'block';
        }
      });

      pickButton.addEventListener('click', async () => {
        pickButton.disabled = true;
        try {
          await pickUser();
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.style.display = 'block';
        } finally {
          pickButton.disabled = false;
        }
      });

      fetchUsers().catch((err) => {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
      });
    </script>
  </body>
</html>
